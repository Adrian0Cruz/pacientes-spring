spring.application.name=pacientes-spring
# Configuración de conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patient_service_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Configuración de JPA / Hibernate
# "update" creará o actualizará las tablas de la BD automáticamente basado en tus entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:my_super_secret_jwt_key_that_must_be_at_least_256_bits_long!}